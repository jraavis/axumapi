[package]
name = "siderite-bench"
description = "Criterion benchmarks for siderite routing, extraction and the ORM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
bench = false

[dependencies]

[dev-dependencies]
axum.workspace = true
siderite.workspace = true
siderite-backends = { workspace = true, features = ["sqlite", "postgres"] }
criterion = { workspace = true, features = ["async_tokio"] }
http.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower.workspace = true

[[bench]]
name = "routing"
harness = false

[[bench]]
name = "extract"
harness = false

[[bench]]
name = "orm"
harness = false
