[package]
name = "axumapi-cli"
description = "The axumapi command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
axumapi-backends = { workspace = true, features = ["sqlite"] }
axumapi-migrations.workspace = true
axumapi-orm.workspace = true
tokio.workspace = true

[features]
default = []
postgres = ["axumapi-backends/postgres"]

[[bin]]
name = "axumapi"
path = "src/main.rs"
