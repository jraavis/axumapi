[package]
name = "siderite-cache"
description = "Cache backends (in-memory LRU, Redis) and route caching for siderite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = []
tls = ["siderite-backends?/tls"]
redis = ["dep:siderite-backends", "siderite-backends/redis"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
httpdate.workspace = true
uuid.workspace = true
siderite-core.workspace = true
http.workspace = true
lru.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tower.workspace = true
tracing.workspace = true
siderite-backends = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
siderite-testkit.workspace = true
bytes.workspace = true
futures-util.workspace = true
tokio.workspace = true
