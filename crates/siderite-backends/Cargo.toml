[package]
name = "siderite-backends"
description = "SQL query compilers and database backends for siderite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
siderite-orm.workspace = true
async-trait.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
mongodb = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dependencies.mysql_async]
version = "=0.37.1"
optional = true
default-features = false
features = ["minimal-rust", "rustls-tls", "ring", "tls12"]

[features]
default = ["sqlite"]
tls = [
    "sqlx/tls-rustls-ring-webpki",
    "redis?/tokio-rustls-comp",
    "redis?/tls-rustls-webpki-roots",
]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]
mysql = ["sqlx/mysql"]
mysql-native = [
    "mysql", "dep:mysql_async", "dep:chrono", "dep:rust_decimal",
    "dep:serde_json",
]
mongodb = ["dep:mongodb", "dep:chrono", "dep:rust_decimal", "dep:serde_json", "dep:uuid"]
redis = ["dep:redis", "dep:serde", "dep:serde_json"]

[dev-dependencies]
chrono.workspace = true
futures-util.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
