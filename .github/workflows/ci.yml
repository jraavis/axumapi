name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  live:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: axumapi, POSTGRES_PASSWORD: axumapi, POSTGRES_DB: axumapi }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U axumapi" --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: axumapi, MYSQL_USER: axumapi, MYSQL_PASSWORD: axumapi, MYSQL_DATABASE: axumapi }
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -paxumapi" --health-interval 2s --health-retries 60
      mongodb:
        image: mongo:8
        ports: ["27017:27017"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://axumapi:axumapi@127.0.0.1:5432/axumapi
      MYSQL_URL: mysql://axumapi:axumapi@127.0.0.1:3306/axumapi
      MONGODB_URL: mongodb://127.0.0.1:27017/axumapi
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features -- --include-ignored --test-threads=1

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --all-targets

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
