# Databases for the gated live tests. Host ports are offset (5xxxx) so they
# do not collide with locally installed servers.
#
#   docker compose up -d --wait
#   DATABASE_URL=postgres://axumapi:axumapi@127.0.0.1:55432/axumapi \
#   MYSQL_URL=mysql://axumapi:axumapi@127.0.0.1:53306/axumapi \
#   MONGODB_URL=mongodb://127.0.0.1:57017/axumapi \
#   REDIS_URL=redis://127.0.0.1:56379/0 \
#   cargo test --workspace --all-features -- --include-ignored
#
# These credentials are for local testing only.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: axumapi
      POSTGRES_PASSWORD: axumapi
      POSTGRES_DB: axumapi
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axumapi"]
      interval: 2s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: axumapi
      MYSQL_USER: axumapi
      MYSQL_PASSWORD: axumapi
      MYSQL_DATABASE: axumapi
    ports: ["127.0.0.1:53306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-paxumapi"]
      interval: 2s
      retries: 60

  mongodb:
    image: mongo:8
    ports: ["127.0.0.1:57017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
