# Databases for the gated live tests. Host ports are offset (5xxxx) so they
# do not collide with locally installed servers.
#
#   docker compose up -d --wait
#   DATABASE_URL=postgres://axumapi:axumapi@127.0.0.1:55432/axumapi \
#   MYSQL_URL=mysql://root:axumapi@127.0.0.1:53306/axumapi \
#   MONGODB_URL='mongodb://127.0.0.1:57017/axumapi?directConnection=true' \
#   REDIS_URL=redis://127.0.0.1:56379/15 \
#   cargo test --workspace --all-features -- --include-ignored
#
# MySQL tests create a database per test, so they connect as root. MongoDB
# runs as a single-node replica set because the tests use transactions.
# These credentials are for local testing only.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: axumapi
      POSTGRES_PASSWORD: axumapi
      POSTGRES_DB: axumapi
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axumapi"]
      interval: 2s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: axumapi
      MYSQL_USER: axumapi
      MYSQL_PASSWORD: axumapi
      MYSQL_DATABASE: axumapi
    ports: ["127.0.0.1:53306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-paxumapi"]
      interval: 2s
      retries: 60

  mongodb:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:57017:27017"]
    healthcheck:
      # Initiates the replica set on first run, then reports its health.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: '127.0.0.1:27017'}]}).ok }"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
